[package]
name = "slate-server"
version = "0.1.0"
edition = "2024"


# axum for web serving
# tokio for async
# serde for struct<->serde_json
# sqlx for data store sqlite, macros gives a compile time check against the database scheme
# dotenvy loads our env file, will be replaced by secrets in k3s
# tower-http serves static files, importantly supports trace to log requests
# sha2 for file hashes
# hex to take the sha256 hashes and turn them into a hexadecimal string that can be sent via http
[dependencies]
axum = { version = "0.8.8", features = ["multipart"]}
tokio = { version = "1.50.0", features = ["full"] }
serde = {version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "macros"]}
dotenvy = "0.15.7"
tower-http = { version = "0.6.8", features = ["fs",  "trace"] }
sha2 = "0.10"
hex = "0.4.3"