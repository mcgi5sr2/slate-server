<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slate Show</title>
    <style>
        /* Fullscreen, no scrollbars, black background */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* Each item fills the screen — hidden by default */
        .slide {
            position: absolute;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            display: none;
        }

        /* Images fill the screen, maintain aspect ratio */
        .slide-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Videos fill the screen */
        .slide-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        /* Web URLs displayed in a fullscreen iframe */
        .slide-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Error message if something goes wrong */
        #error {
            color: white;
            font-family: sans-serif;
            font-size: 2em;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- Slides are injected here by JS -->
    <div id="stage"></div>
    <div id="error"></div>

    <script>
        // Read the location id from the URL query string
        // e.g. kiosk.html?id=reception
        const params = new URLSearchParams(window.location.search);
        const locationId = params.get('id');

        // The current playlist items
        let items = [];

        // Index of the currently displayed item
        let currentIndex = 0;

        // Timer handle for advancing slides — stored so we can cancel it
        let advanceTimer = null;

        // The ETag of the last playlist we received — sent with each poll
        let currentEtag = null;
    
        if (!locationId) {
            document.getElementById('error').textContent = 'No location id specified. Add ?id=yourLocation to the URL.';
        } else {
            start();
        }

        // ── Startup ───────────────────────────────────────────────────────────

        async function start() {
            // Fetch the playlist immediately on load
            await pollPlaylist();

            // Then poll every 10 seconds for changes
            setInterval(pollPlaylist, 10000);
        }

        // ── Polling ───────────────────────────────────────────────────────────

        async function pollPlaylist() {
            // Build request headers — include If-None-Match if we have an ETag
            const headers = {};
            if (currentEtag) {
                headers['If-None-Match'] = currentEtag;
            }

            let res;
            try {
                res = await fetch(`/api/playlist/${locationId}`, { headers });
            } catch (e) {
                // Network error — server unreachable, keep showing current playlist
                console.warn('Poll failed:', e);
                return;
            }

            // 304 Not Modified — playlist unchanged, nothing to do
            if (res.status === 304) return;

            if (!res.ok) {
                console.warn('Poll returned error:', res.status);
                return;
            }

            // Got a new playlist — store the ETag for next poll
            currentEtag = res.headers.get('ETag');

            const playlist = await res.json();

            // Only rebuild the display if the items actually changed
            if (JSON.stringify(playlist.items) !== JSON.stringify(items)) {
                items = playlist.items;
                // Restart from the beginning with the new playlist
                currentIndex = 0;
                buildStage();
                showSlide(0);
            }
        }

        // ── Stage building ────────────────────────────────────────────────────

        // Build the DOM elements for each playlist item
        // We create all slides upfront and show/hide them as needed
        function buildStage() {
            const stage = document.getElementById('stage');
            // Clear any existing slides
            stage.innerHTML = '';

            items.forEach((item, index) => {
                const slide = document.createElement('div');
                slide.className = 'slide';
                slide.id = `slide-${index}`;

                if (item.type === 'image') {
                    // Image slide — img tag with object-fit: contain
                    const img = document.createElement('img');
                    img.className = 'slide-image';
                    img.src = item.url;
                    slide.appendChild(img);

                } else if (item.type === 'video') {
                    // Video slide — video tag, advance when video ends
                    const video = document.createElement('video');
                    video.className = 'slide-video';
                    video.src = item.url;
                    video.autoplay = true;
                    video.muted = true;   // muted required for autoplay in browsers
                    video.playsInline = true;
                    // When the video finishes, advance to the next slide
                    video.addEventListener('ended', () => advance());
                    slide.appendChild(video);

                } else if (item.type === 'url') {
                    // Web URL — fullscreen iframe
                    const iframe = document.createElement('iframe');
                    iframe.className = 'slide-iframe';
                    iframe.src = item.url;
                    slide.appendChild(iframe);
                }

                stage.appendChild(slide);
            });
        }

        // ── Playback ──────────────────────────────────────────────────────────

        // Show the slide at the given index, hide all others
        function showSlide(index) {
            // Cancel any existing advance timer
            if (advanceTimer) {
                clearTimeout(advanceTimer);
                advanceTimer = null;
            }

            // Hide all slides
            document.querySelectorAll('.slide').forEach(s => s.style.display = 'none');

            if (items.length === 0) return;

            const item = items[index];
            const slide = document.getElementById(`slide-${index}`);
            if (!slide) return;

            // Show this slide
            slide.style.display = 'block';

            if (item.type === 'video') {
                // Videos advance when they end via the 'ended' event listener
                // Just make sure the video plays from the start
                const video = slide.querySelector('video');
                if (video) {
                    video.currentTime = 0;
                    video.play();
                }
            } else {
                // Images and URLs advance after duration_secs
                const duration = (item.duration_secs || 10) * 1000;
                advanceTimer = setTimeout(advance, duration);
            }
        }

        // Advance to the next slide, looping back to 0 at the end
        function advance() {
            if (items.length === 0) return;
            currentIndex = (currentIndex + 1) % items.length;
            showSlide(currentIndex);
        }
    </script>
</body>
</html>
