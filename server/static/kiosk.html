<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slate Show</title>
    <style>
        /* Fullscreen, no scrollbars, black background */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* Each slide fills the screen absolutely so they stack on top of each other.
           Opacity controls visibility — CSS transition animates the crossfade.
           pointer-events:none on hidden slides prevents invisible iframes stealing clicks. */
        .slide {
            position: absolute;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease-in-out;
        }

        /* The active slide is fully visible and interactive */
        .slide.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Images fill the screen, maintain aspect ratio */
        .slide-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Videos fill the screen */
        .slide-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        /* Web URLs displayed in a fullscreen iframe */
        .slide-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Error message if something goes wrong */
        #error {
            color: white;
            font-family: sans-serif;
            font-size: 2em;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="stage"></div>
    <div id="error"></div>

    <script>
        // Read location id from the URL path — e.g. /kiosk/reception → "reception"
        const locationId = window.location.pathname.split('/').pop();


        let items = [];
        let currentIndex = 0;
        let advanceTimer = null;
        let currentEtag = null;

        if (!locationId) {
            document.getElementById('error').textContent = 'No location id in URL. Use /kiosk/your-location-id';
        } else {
            start();
        }

        // ── Startup ───────────────────────────────────────────────────────────

        async function start() {
            await pollPlaylist();
            setInterval(pollPlaylist, 10000);
        }

        // ── Polling ───────────────────────────────────────────────────────────

        async function pollPlaylist() {
            const headers = {};
            if (currentEtag) headers['If-None-Match'] = currentEtag;

            let res;
            try {
                res = await fetch(`/api/playlist/${locationId}`, { headers });
            } catch (e) {
                console.warn('Poll failed:', e);
                return;
            }

            if (res.status === 304) return;
            if (!res.ok) { console.warn('Poll error:', res.status); return; }

            currentEtag = res.headers.get('ETag');
            const playlist = await res.json();

            if (JSON.stringify(playlist.items) !== JSON.stringify(items)) {
                items = playlist.items;
                currentIndex = 0;
                buildStage();
                showSlide(0);
            }
        }

        // ── Stage building ────────────────────────────────────────────────────

        function buildStage() {
            const stage = document.getElementById('stage');
            stage.innerHTML = '';

            items.forEach((item, index) => {
                const slide = document.createElement('div');
                slide.className = 'slide';
                slide.id = `slide-${index}`;

                if (item.type === 'image') {
                    const img = document.createElement('img');
                    img.className = 'slide-image';
                    img.src = item.url;
                    slide.appendChild(img);

                } else if (item.type === 'video') {
                    const video = document.createElement('video');
                    video.className = 'slide-video';
                    video.src = item.url;
                    video.autoplay = true;
                    video.muted = true;
                    video.playsInline = true;
                    video.addEventListener('ended', () => advance());
                    slide.appendChild(video);

                } else if (item.type === 'url') {
                    const iframe = document.createElement('iframe');
                    iframe.className = 'slide-iframe';
                    iframe.src = item.url;
                    slide.appendChild(iframe);
                }

                stage.appendChild(slide);
            });
        }

        // ── Playback ──────────────────────────────────────────────────────────

        // Crossfade to the slide at the given index.
        // We add the 'active' class (opacity: 1) to the new slide and remove it
        // from all others. CSS transition handles the smooth fade between them.
        function showSlide(index) {
            if (advanceTimer) {
                clearTimeout(advanceTimer);
                advanceTimer = null;
            }

            if (items.length === 0) return;

            const item = items[index];
            const nextSlide = document.getElementById(`slide-${index}`);
            if (!nextSlide) return;

            // Fade out all slides, fade in the new one
            document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
            nextSlide.classList.add('active');

            if (item.type === 'video') {
                // Reset and play video from the start
                const video = nextSlide.querySelector('video');
                if (video) {
                    video.currentTime = 0;
                    video.play();
                }
            } else {
                // Advance after duration — wait for the fade to finish first (0.8s)
                // so the timer starts when the slide is fully visible
                const duration = (item.duration_secs || 10) * 1000;
                advanceTimer = setTimeout(advance, duration + 800);
            }
        }

        // Advance to the next slide, looping back to 0 at the end
        function advance() {
            if (items.length === 0) return;
            currentIndex = (currentIndex + 1) % items.length;
            showSlide(currentIndex);
        }
    </script>
</body>
</html>
