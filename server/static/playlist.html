<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slate Show — Playlist Editor</title>
    <link rel="icon" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Drag and drop styles */
        .item[draggable="true"] { cursor: grab; }
        .item.drag-over { border: 2px dashed var(--drag-over-border); background: var(--drag-over-bg); }
        .item.dragging { opacity: 0.4; }

        /* Duration stepper — hide native number input arrows */
        .stepper {
            display: flex;
            align-items: center;
            gap: 0;
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
            flex-shrink: 0;
        }
        .stepper button {
            border: none;
            border-radius: 0;
            padding: 2px 7px;
            font-size: 1em;
            line-height: 1;
            background: var(--surface-alt);
            color: var(--text);
            min-width: 26px;
        }
        .stepper button:hover { background: var(--accent); color: white; }
        .stepper input[type="number"] {
            width: 44px;
            border: none;
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
            border-radius: 0;
            text-align: center;
            font-size: 0.85em;
            padding: 2px 0;
            -moz-appearance: textfield;
            appearance: textfield; /* hide native spinner */
        }
        .stepper input[type="number"]::-webkit-inner-spin-button,
        .stepper input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            appearance: none;
        }
        .duration-unit { font-size: 0.8em; color: var(--text-muted); margin-left: 4px; flex-shrink: 0; }
    </style>
</head>
<body>
    <button id="theme-toggle" onclick="cycleTheme()">🌙 Dark</button>
    <a class="back" href="index.html">← Back to locations</a>
    <h1 id="page-title">Playlist Editor</h1>

    <!-- Current playlist items — populated by JS -->
    <div id="playlist"></div>

    <div class="actions">
        <button class="danger" onclick="clearPlaylist()">Clear Playlist</button>
    </div>
    <div id="status"></div>
    <div id="error"></div>

    <!-- Form to add a new item -->
    <div class="add-form">
        <h3>Add Item</h3>

        <div class="field">
            <label for="item-type">Type</label>
            <select id="item-type" onchange="onTypeChange()">
                <option value="image">Image</option>
                <option value="video">Video</option>
                <option value="url">Web URL</option>
            </select>
        </div>

        <!-- Duration field — shown for image and url types, not video -->
        <div class="field" id="field-duration">
            <label for="item-duration">Duration (seconds)</label>
            <input type="number" id="item-duration" value="10" min="1">
        </div>

        <!-- Add item panels — each method gets its own box -->
        <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:12px;">

            <!-- Panel A: upload a file -->
            <div class="add-panel">
                <div class="add-panel-title">Upload File</div>
                <div class="field" style="margin-bottom:8px;">
                    <label>Name (no extension)</label>
                    <input type="text" id="upload-name" placeholder="e.g. logo (no spaces)">
                </div>
                <div class="field" style="margin-bottom:8px;">
                    <label>File</label>
                    <input type="file" id="upload-file" style="display:none;" onchange="updateFileLabel()">
                    <button class="secondary" onclick="document.getElementById('upload-file').click()">
                        <span id="file-label">Choose file</span>
                    </button>
                </div>
                <div class="progress-bar-wrap" id="upload-progress-wrap">
                    <div class="progress-bar-fill" id="upload-progress-fill"></div>
                </div>
                <button class="primary" style="width:100%; margin-top:8px;" onclick="uploadAndAdd()">Upload &amp; Add</button>
            </div>

            <!-- Panel B: add a URL directly (e.g. Grafana dashboard) -->
            <div class="add-panel">
                <div class="add-panel-title">Add URL</div>
                <div class="field" style="margin-bottom:8px;">
                    <label>URL</label>
                    <input type="text" id="item-url" placeholder="">
                </div>
                <button class="primary" style="width:100%; margin-top:8px;" onclick="addAndSave()">Add &amp; Save</button>
            </div>

            <!-- Panel C: upload a PDF — rendered to PNG pages server-side -->
            <div class="add-panel">
                <div class="add-panel-title">Upload PDF</div>
                <div class="field" style="margin-bottom:8px;">
                    <label>Name (no extension)</label>
                    <input type="text" id="pdf-name" placeholder="e.g. monthly-report">
                </div>
                <div class="field" style="margin-bottom:8px;">
                    <label>Seconds per page</label>
                    <div class="stepper">
                        <button onclick="stepPdfDuration(-5)">−</button>
                        <input type="number" id="pdf-duration" value="10" min="1">
                        <button onclick="stepPdfDuration(5)">+</button>
                    </div>
                </div>
                <div class="field" style="margin-bottom:8px;">
                    <label>File</label>
                    <input type="file" id="pdf-file" accept=".pdf" style="display:none;" onchange="updatePdfLabel()">
                    <button class="secondary" onclick="document.getElementById('pdf-file').click()">
                        <span id="pdf-file-label">Choose PDF</span>
                    </button>
                </div>
                <button class="primary" style="width:100%; margin-top:8px;" onclick="uploadPdfAndAdd()">Upload &amp; Add</button>
            </div>

        </div>
    </div>

    <script src="app.js"></script>
    <script src="theme.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const locationId = params.get('id');

        document.getElementById('item-url').placeholder = `/uploads/${locationId}/my-image.jpg`;

        let items = [];

        // Index being dragged — used by drag-and-drop handlers
        let dragSrcIndex = null;

        document.getElementById('page-title').textContent = `Playlist — ${locationId}`;
        loadCurrent();

        async function loadCurrent() {
            const playlist = await loadPlaylist(locationId);
            items = playlist.items;
            renderPlaylist();
        }

        // Render playlist items with thumbnails, inline duration edit, and drag handles
        function renderPlaylist() {
            const container = document.getElementById('playlist');
            if (items.length === 0) {
                container.innerHTML = '<p>No items yet. Add one below.</p>';
                return;
            }

            container.innerHTML = items.map((item, index) => `
                <div class="item"
                     draggable="true"
                     data-index="${index}"
                     ondragstart="onDragStart(event, ${index})"
                     ondragover="onDragOver(event)"
                     ondragleave="onDragLeave(event)"
                     ondrop="onDrop(event, ${index})"
                     ondragend="onDragEnd(event)">
                    ${itemThumb(item)}
                    ${itemTypeBadge(item.type)}
                    <span class="item-url">${item.type === 'pdf' ? `${(item.urls || []).length} pages` : (item.url || '')}</span>
                    ${item.type === 'video' ? '<span class="item-duration">auto</span>' :
                      item.type === 'pdf' ? `
                        <div class="stepper">
                            <button onclick="stepPdfItemDuration(${index}, -5)">−</button>
                            <input type="number"
                                   value="${item.seconds_per_page || 10}"
                                   min="1"
                                   title="Seconds per page"
                                   onchange="updatePdfItemDuration(${index}, this.value)">
                            <button onclick="stepPdfItemDuration(${index}, 5)">+</button>
                        </div>
                        <span class="duration-unit">s/pg</span>
                      ` : `
                        <div class="stepper">
                            <button onclick="stepDuration(${index}, -5)">−</button>
                            <input type="number"
                                   value="${item.duration_secs || 10}"
                                   min="1"
                                   title="Duration in seconds"
                                   onchange="updateDuration(${index}, this.value)">
                            <button onclick="stepDuration(${index}, 5)">+</button>
                        </div>
                        <span class="duration-unit">s</span>
                      `}
                    <button class="danger" onclick="removeAndSave(${index})">Remove</button>
                </div>
            `).join('');
        }

        // ── Drag and drop ─────────────────────────────────────────────────────

        function onDragStart(e, index) {
            dragSrcIndex = index;
            // Add a dragging class to fade the item being dragged
            e.currentTarget.classList.add('dragging');
            // Required for Firefox
            e.dataTransfer.effectAllowed = 'move';
        }

        function onDragOver(e, index) {
            // Prevent the default which would cancel the drop
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            e.currentTarget.classList.add('drag-over');
        }

        function onDragLeave(e) {
            e.currentTarget.classList.remove('drag-over');
        }

        async function onDrop(e, dropIndex) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');

            if (dragSrcIndex === null || dragSrcIndex === dropIndex) return;

            // Remove the dragged item and insert it at the drop position
            const [moved] = items.splice(dragSrcIndex, 1);
            items.splice(dropIndex, 0, moved);

            renderPlaylist();
            await persistPlaylist();
        }

        function onDragEnd(e) {
            // Clean up dragging styles in case dragover didn't fire on all elements
            document.querySelectorAll('.item').forEach(el => {
                el.classList.remove('dragging', 'drag-over');
            });
            dragSrcIndex = null;
        }

        // ── Inline duration edit ──────────────────────────────────────────────

        // Step duration by a delta (e.g. +5 or -5 seconds)
        async function stepDuration(index, delta) {
            const current = items[index].duration_secs || 10;
            const next = Math.max(1, current + delta);
            items[index].duration_secs = next;
            // Update the input value directly without re-rendering the whole list
            const input = document.querySelector(`#slide-item-${index} input[type="number"]`);
            if (input) input.value = next;
            renderPlaylist();
            await persistPlaylist();
        }

        async function updateDuration(index, value) {
            const secs = parseInt(value);
            if (isNaN(secs) || secs < 1) return;
            items[index].duration_secs = secs;
            await persistPlaylist();
        }

        async function stepPdfItemDuration(index, delta) {
            const current = items[index].seconds_per_page || 10;
            items[index].seconds_per_page = Math.max(1, current + delta);
            renderPlaylist();
            await persistPlaylist();
        }

        async function updatePdfItemDuration(index, value) {
            const secs = parseInt(value);
            if (isNaN(secs) || secs < 1) return;
            items[index].seconds_per_page = secs;
            await persistPlaylist();
        }

        // ── Playlist actions ──────────────────────────────────────────────────

        async function removeAndSave(index) {
            items.splice(index, 1);
            renderPlaylist();
            await persistPlaylist();
        }

        async function clearPlaylist() {
            if (!confirm('Clear the entire playlist?')) return;
            items = [];
            renderPlaylist();
            await persistPlaylist();
        }

        function onTypeChange() {
            const type = document.getElementById('item-type').value;
            document.getElementById('field-duration').style.display =
                type === 'video' ? 'none' : 'block';
        }

        // Update the file button label when a file is selected.
        // Also auto-sets the item type based on the file extension.
        function updateFileLabel() {
            const fileInput = document.getElementById('upload-file');
            const file = fileInput.files[0];
            const label = document.getElementById('file-label');
            label.textContent = file ? file.name : 'Choose file';

            if (!file) return;

            // Detect type from extension and update the type dropdown
            const ext = file.name.split('.').pop().toLowerCase();
            const videoExts = ['mp4', 'webm', 'mov', 'avi', 'mkv'];
            const imageExts = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg'];

            const typeSelect = document.getElementById('item-type');
            if (videoExts.includes(ext)) {
                typeSelect.value = 'video';
            } else if (imageExts.includes(ext)) {
                typeSelect.value = 'image';
            }
            // Trigger the duration field show/hide
            onTypeChange();
        }

        // Upload a file and immediately add it to the playlist
        async function uploadAndAdd() {
            // Replace spaces with hyphens — slugs can't contain spaces
            const raw = document.getElementById('upload-name').value.trim();
            const name = raw.replace(/\s+/g, '-');
            const fileInput = document.getElementById('upload-file');
            const file = fileInput.files[0];

            if (!name || !file) {
                alert('Please enter a name and select a file.');
                return;
            }

            const url = await uploadFile(locationId, name, file);
            if (!url) {
                alert('Upload failed.');
                return;
            }

            document.getElementById('upload-name').value = '';
            fileInput.value = '';
            document.getElementById('file-label').textContent = 'Choose file';

            const type = document.getElementById('item-type').value;
            const duration = parseInt(document.getElementById('item-duration').value);
            const item = { type, url };
            if (type !== 'video') item.duration_secs = duration;

            items.push(item);
            renderPlaylist();
            await persistPlaylist();
        }

        // Add a manually entered URL to the playlist and save
        async function addAndSave() {
            const type = document.getElementById('item-type').value;
            const url = document.getElementById('item-url').value.trim();
            const duration = parseInt(document.getElementById('item-duration').value);

            if (!url) {
                alert('Please enter a URL.');
                return;
            }

            const item = { type, url };
            if (type !== 'video') item.duration_secs = duration;

            items.push(item);
            renderPlaylist();
            document.getElementById('item-url').value = '';

            await persistPlaylist();
        }

        // ── PDF upload ────────────────────────────────────────────────────────

        function updatePdfLabel() {
            const file = document.getElementById('pdf-file').files[0];
            document.getElementById('pdf-file-label').textContent = file ? file.name : 'Choose PDF';
        }

        function stepPdfDuration(delta) {
            const input = document.getElementById('pdf-duration');
            input.value = Math.max(1, parseInt(input.value) + delta);
        }

        // Upload a PDF, get back page_urls, add as a pdf playlist item
        async function uploadPdfAndAdd() {
            const name = document.getElementById('pdf-name').value.trim().replace(/\s+/g, '-');
            const fileInput = document.getElementById('pdf-file');
            const file = fileInput.files[0];
            const secondsPerPage = parseInt(document.getElementById('pdf-duration').value);

            if (!name || !file) {
                alert('Please enter a name and select a PDF.');
                return;
            }

            // Upload the PDF using multipart form
            const form = new FormData();
            form.append('location_id', locationId);
            form.append('name', name);
            form.append('file', file);

            const res = await fetch('/api/upload', { method: 'POST', body: form });

            if (!res.ok) {
                alert('PDF upload failed.');
                return;
            }

            const data = await res.json();

            if (!data.page_urls || data.page_urls.length === 0) {
                alert('PDF rendered no pages.');
                return;
            }

            // Build a pdf playlist item with the page URLs and seconds per page
            const item = {
                type: 'pdf',
                urls: data.page_urls,
                seconds_per_page: secondsPerPage,
            };

            items.push(item);
            renderPlaylist();
            await persistPlaylist();

            // Clear the form
            document.getElementById('pdf-name').value = '';
            fileInput.value = '';
            document.getElementById('pdf-file-label').textContent = 'Choose PDF';
        }

        async function persistPlaylist() {
            const res = await savePlaylist(locationId, items);
            if (res.ok) {
                document.getElementById('status').textContent = 'Saved!';
                document.getElementById('error').textContent = '';
                setTimeout(() => document.getElementById('status').textContent = '', 2000);
            } else {
                document.getElementById('error').textContent = 'Save failed.';
            }
        }
    </script>
</body>
</html>
