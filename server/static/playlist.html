<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slate Show — Playlist Editor</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Drag and drop styles */
        .item[draggable="true"] { cursor: grab; }
        .item.drag-over { border: 2px dashed #0066cc; background: #e8f0ff; }
        .item.dragging { opacity: 0.4; }

        /* Inline duration editor */
        .item-duration-edit {
            width: 52px;
            padding: 2px 4px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.85em;
            text-align: center;
        }
        .duration-unit { font-size: 0.8em; color: #888; margin-left: 2px; }
    </style>
</head>
<body>
    <button id="theme-toggle" onclick="cycleTheme()">🌙 Dark</button>
    <a class="back" href="index.html">← Back to locations</a>
    <h1 id="page-title">Playlist Editor</h1>

    <!-- Current playlist items — populated by JS -->
    <div id="playlist"></div>

    <div class="actions">
        <button class="danger" onclick="clearPlaylist()">Clear Playlist</button>
    </div>
    <div id="status"></div>
    <div id="error"></div>

    <!-- Form to add a new item -->
    <div class="add-form">
        <h3>Add Item</h3>

        <div class="field">
            <label for="item-type">Type</label>
            <select id="item-type" onchange="onTypeChange()">
                <option value="image">Image</option>
                <option value="video">Video</option>
                <option value="url">Web URL</option>
            </select>
        </div>

        <!-- Duration field — shown for image and url types, not video -->
        <div class="field" id="field-duration">
            <label for="item-duration">Duration (seconds)</label>
            <input type="number" id="item-duration" value="10" min="1">
        </div>

        <!-- Action bar — left to right flow: upload → url → add & save -->
        <div style="display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; margin-top:10px;">

            <!-- Step 1: upload a file -->
            <div class="field" style="margin:0;">
                <label>1. Upload file</label>
                <div style="display:flex; gap:4px;">
                    <input type="text" id="upload-name" placeholder="name (no extension)">
                    <input type="file" id="upload-file">
                    <button class="secondary" onclick="doUpload()">Upload File</button>
                </div>
                <!-- Progress bar — shown during upload, hidden otherwise -->
                <div class="progress-bar-wrap" id="upload-progress-wrap">
                    <div class="progress-bar-fill" id="upload-progress-fill"></div>
                </div>
            </div>

            <!-- Step 2: URL field — auto-filled by upload, or type manually -->
            <div class="field" style="margin:0;">
                <label>2. URL</label>
                <input type="text" id="item-url" placeholder="">
            </div>

            <!-- Step 3: add to playlist and save in one click -->
            <div class="field" style="margin:0;">
                <label>&nbsp;</label>
                <button class="primary" onclick="addAndSave()">3. Add &amp; Save</button>
            </div>

        </div>
    </div>

    <script src="app.js"></script>
    <script src="theme.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const locationId = params.get('id');

        document.getElementById('item-url').placeholder = `/uploads/${locationId}/my-image.jpg`;

        let items = [];

        // Index being dragged — used by drag-and-drop handlers
        let dragSrcIndex = null;

        document.getElementById('page-title').textContent = `Playlist — ${locationId}`;
        loadCurrent();

        async function loadCurrent() {
            const playlist = await loadPlaylist(locationId);
            items = playlist.items;
            renderPlaylist();
        }

        // Render playlist items with thumbnails, inline duration edit, and drag handles
        function renderPlaylist() {
            const container = document.getElementById('playlist');
            if (items.length === 0) {
                container.innerHTML = '<p>No items yet. Add one below.</p>';
                return;
            }

            container.innerHTML = items.map((item, index) => `
                <div class="item"
                     draggable="true"
                     data-index="${index}"
                     ondragstart="onDragStart(event, ${index})"
                     ondragover="onDragOver(event)"
                     ondragleave="onDragLeave(event)"
                     ondrop="onDrop(event, ${index})"
                     ondragend="onDragEnd(event)">
                    ${itemThumb(item)}
                    ${itemTypeBadge(item.type)}
                    <span class="item-url">${item.url || ''}</span>
                    ${item.type !== 'video' ? `
                        <input class="item-duration-edit"
                               type="number"
                               value="${item.duration_secs || 10}"
                               min="1"
                               title="Duration in seconds"
                               onchange="updateDuration(${index}, this.value)">
                        <span class="duration-unit">s</span>
                    ` : '<span class="item-duration">auto</span>'}
                    <button class="danger" onclick="removeAndSave(${index})">Remove</button>
                </div>
            `).join('');
        }

        // ── Drag and drop ─────────────────────────────────────────────────────

        function onDragStart(e, index) {
            dragSrcIndex = index;
            // Add a dragging class to fade the item being dragged
            e.currentTarget.classList.add('dragging');
            // Required for Firefox
            e.dataTransfer.effectAllowed = 'move';
        }

        function onDragOver(e, index) {
            // Prevent the default which would cancel the drop
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            e.currentTarget.classList.add('drag-over');
        }

        function onDragLeave(e) {
            e.currentTarget.classList.remove('drag-over');
        }

        async function onDrop(e, dropIndex) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');

            if (dragSrcIndex === null || dragSrcIndex === dropIndex) return;

            // Remove the dragged item and insert it at the drop position
            const [moved] = items.splice(dragSrcIndex, 1);
            items.splice(dropIndex, 0, moved);

            renderPlaylist();
            await persistPlaylist();
        }

        function onDragEnd(e) {
            // Clean up dragging styles in case dragover didn't fire on all elements
            document.querySelectorAll('.item').forEach(el => {
                el.classList.remove('dragging', 'drag-over');
            });
            dragSrcIndex = null;
        }

        // ── Inline duration edit ──────────────────────────────────────────────

        async function updateDuration(index, value) {
            const secs = parseInt(value);
            if (isNaN(secs) || secs < 1) return;
            items[index].duration_secs = secs;
            await persistPlaylist();
        }

        // ── Playlist actions ──────────────────────────────────────────────────

        async function removeAndSave(index) {
            items.splice(index, 1);
            renderPlaylist();
            await persistPlaylist();
        }

        async function clearPlaylist() {
            if (!confirm('Clear the entire playlist?')) return;
            items = [];
            renderPlaylist();
            await persistPlaylist();
        }

        function onTypeChange() {
            const type = document.getElementById('item-type').value;
            document.getElementById('field-duration').style.display =
                type === 'video' ? 'none' : 'block';
        }

        async function doUpload() {
            const name = document.getElementById('upload-name').value.trim();
            const fileInput = document.getElementById('upload-file');
            const file = fileInput.files[0];

            if (!name || !file) {
                alert('Please enter a name and select a file.');
                return;
            }

            const url = await uploadFile(locationId, name, file);
            if (url) {
                document.getElementById('item-url').value = url;
                document.getElementById('upload-name').value = '';
                fileInput.value = '';
            } else {
                alert('Upload failed.');
            }
        }

        async function addAndSave() {
            const type = document.getElementById('item-type').value;
            const url = document.getElementById('item-url').value.trim();
            const duration = parseInt(document.getElementById('item-duration').value);

            if (!url) {
                alert('Please enter a URL or upload a file first.');
                return;
            }

            const item = { type, url };
            if (type !== 'video') item.duration_secs = duration;

            items.push(item);
            renderPlaylist();
            document.getElementById('item-url').value = '';

            await persistPlaylist();
        }

        async function persistPlaylist() {
            const res = await savePlaylist(locationId, items);
            if (res.ok) {
                document.getElementById('status').textContent = 'Saved!';
                document.getElementById('error').textContent = '';
                setTimeout(() => document.getElementById('status').textContent = '', 2000);
            } else {
                document.getElementById('error').textContent = 'Save failed.';
            }
        }
    </script>
</body>
</html>
